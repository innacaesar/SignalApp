<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>My Chat App</title>
</head>
<body>
    <div>
        Enter username:<br />
        <input id="userName" type="text" /><br /><br />
        Enter message:<br />
        <input type="text" id="message" /><br /><br />
        <input type="button" id="sendBtn" value="Send" disabled="disabled" />
    </div>
    <div id="chatroom"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.js"></script>
    
    
    <script>
        const hubConnection = new signalR.HubConnectionBuilder()
            .withUrl("/chat")
            .build();

        document.getElementById("sendBtn").addEventListener("click", function () {
            const userName = document.getElementById("userName").value;   // מקבל את שם המשתמש מהשדה המתאים
            const message = document.getElementById("message").value;

            hubConnection.invoke("Send", userName, message) // שולח את שם המשתמש וההודעה לשרת
                .catch(function (err) {
                    return console.error(err.toString());
                });
        });
        // קוד זה מאזין לאירוע "Receive" מהשרת ומוסיף את ההודעה ל-HTML
        hubConnection.on("Receive", function (userName, message) {

            // יוצר אלמנט <b> עבור שם המשתמש
            const userNameElem = document.createElement("b");
            userNameElem.textContent = `${userName}: `;

            // יוצר אלמנט <p> עבור ההודעה ומוסיף את שם המשתמש וההודעה לתוכו
            const elem = document.createElement("p");
            elem.appendChild(userNameElem);
            elem.appendChild(document.createTextNode(message));

            // נוסיף את האלמנט החדש בתחילת החדר
            // לזה, אנו מקבלים את האלמנט הראשון של החדר ומכניסים את ההודעה החדשה לפניו
            const firstElem = document.getElementById("chatroom").firstChild;
            document.getElementById("chatroom").insertBefore(elem, firstElem);
        });

        hubConnection.start()
            .then(function () {
                document.getElementById("sendBtn").disabled = false;
            })
            .catch(function (err) {
                return console.error(err.toString());
            });
    </script>
</body>
</html>
